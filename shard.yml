name: prism
version: 1.0.4

authors:
  - Philippe <papilip@github>

description: |
  AsciiDoc editor and publisher for Crystal.
  Edit, style, and export to HTML, PDF & EPUB.

crystal: ">= 1.19.0"

license: MIT

targets:
  prism:
    main: src/prism.cr

dependencies:
  webview:
    github: naqvis/webview
  asciicrystal:
    github: aloli-crystal/asciicrystal
    version: "~> 2.0.26.12"
  asciicrystal-pdf:
    github: aloli-crystal/asciicrystal-pdf
    branch: production
  asciicrystal-epub3:
    github: aloli-crystal/asciicrystal-epub3
    branch: production
  appkit:
    github: aloli-crystal/appkit
    branch: production
