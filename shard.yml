name: prism
version: 1.0.0

authors:
  - Philippe <papilip@github>

description: |
  AsciiDoc editor and publisher for Crystal.
  Edit, style, and export to HTML, PDF & EPUB.

crystal: ">= 1.19.0"

license: MIT

targets:
  Prism:
    main: src/prism.cr

dependencies:
  webview:
    github: naqvis/webview
  crystal-asciidoctor:
    github: aloli-crystal/crystal-asciidoctor
    version: "~> 2.0"
  crystal-asciidoctor-pdf:
    github: aloli-crystal/crystal-asciidoctor-pdf
    branch: production
  crystal-asciidoctor-epub3:
    github: aloli-crystal/crystal-asciidoctor-epub3
    branch: production
  crystal-appkit:
    github: aloli-crystal/crystal-appkit
    branch: development
