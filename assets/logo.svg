<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="beam-in" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e2e8f0;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.95"/>
    </linearGradient>
    <linearGradient id="crystal-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a0aec0;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#4a5568;stop-opacity:0.95"/>
    </linearGradient>
    <linearGradient id="crystal-right" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#cbd5e0;stop-opacity:0.85"/>
      <stop offset="100%" style="stop-color:#718096;stop-opacity:0.9"/>
    </linearGradient>
    <linearGradient id="crystal-top" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e2e8f0;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#edf2f7;stop-opacity:0.95"/>
    </linearGradient>
    <linearGradient id="crystal-center" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#718096;stop-opacity:0.85"/>
      <stop offset="100%" style="stop-color:#4a5568;stop-opacity:0.9"/>
    </linearGradient>
    <linearGradient id="ray-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fc8181"/>
      <stop offset="100%" style="stop-color:#f56565;stop-opacity:0.7"/>
    </linearGradient>
    <linearGradient id="ray-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f6ad55"/>
      <stop offset="100%" style="stop-color:#ed8936;stop-opacity:0.7"/>
    </linearGradient>
    <linearGradient id="ray-yellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#faf089"/>
      <stop offset="100%" style="stop-color:#ecc94b;stop-opacity:0.7"/>
    </linearGradient>
    <linearGradient id="ray-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#68d391"/>
      <stop offset="100%" style="stop-color:#48bb78;stop-opacity:0.7"/>
    </linearGradient>
    <linearGradient id="ray-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#63b3ed"/>
      <stop offset="100%" style="stop-color:#4299e1;stop-opacity:0.7"/>
    </linearGradient>
    <linearGradient id="ray-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#b794f4"/>
      <stop offset="100%" style="stop-color:#9f7aea;stop-opacity:0.7"/>
    </linearGradient>
  </defs>

  <!-- Faisceau entrant -->
  <polygon points="30,240 170,252 170,268 30,258" fill="url(#beam-in)" opacity="0.85"/>

  <!-- Cristal hexagonal - forme de gemme taillée -->
  <!-- Face supérieure gauche -->
  <polygon points="210,160 256,130 256,200 210,220" fill="url(#crystal-top)"/>
  <!-- Face supérieure droite -->
  <polygon points="256,130 305,160 305,220 256,200" fill="#d0d8e2" opacity="0.9"/>
  <!-- Face centre gauche -->
  <polygon points="190,220 210,160 210,220 190,280" fill="url(#crystal-left)"/>
  <!-- Face centre -->
  <polygon points="210,220 256,200 305,220 256,260" fill="url(#crystal-center)"/>
  <!-- Face centre droite -->
  <polygon points="305,160 325,220 305,280 305,220" fill="url(#crystal-right)"/>
  <!-- Face inférieure gauche -->
  <polygon points="190,280 210,220 256,260 256,340" fill="#5a6577" opacity="0.9"/>
  <!-- Face inférieure droite -->
  <polygon points="256,260 305,220 325,280 256,340" fill="#4a5568" opacity="0.85"/>

  <!-- Reflets -->
  <polygon points="220,170 245,155 245,195 220,210" fill="white" opacity="0.15"/>
  <polygon points="260,140 290,155 290,180 260,165" fill="white" opacity="0.08"/>

  <!-- Rayons sortants (spectre = formats de sortie) -->
  <polygon points="325,210 480,130 480,143 325,220" fill="url(#ray-red)" opacity="0.85"/>
  <polygon points="325,225 480,170 480,183 325,235" fill="url(#ray-orange)" opacity="0.85"/>
  <polygon points="325,240 480,215 480,228 325,250" fill="url(#ray-yellow)" opacity="0.85"/>
  <polygon points="325,255 480,260 480,273 325,265" fill="url(#ray-green)" opacity="0.85"/>
  <polygon points="325,270 480,308 480,321 325,280" fill="url(#ray-blue)" opacity="0.85"/>
  <polygon points="325,285 480,360 480,373 325,295" fill="url(#ray-purple)" opacity="0.85"/>

  <!-- Labels -->
  <text x="30" y="232" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="#a0aec0">AsciiDoc</text>
  <text x="462" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#f56565" text-anchor="end">HTML</text>
  <text x="470" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#ecc94b" text-anchor="end">PDF</text>
  <text x="475" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#9f7aea" text-anchor="end">EPUB</text>

  <!-- Nom -->
  <text x="256" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="#2d3748" text-anchor="middle" letter-spacing="4">PRISM</text>
  <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#718096" text-anchor="middle" letter-spacing="2">AsciiDoc Editor for Crystal</text>
</svg>
